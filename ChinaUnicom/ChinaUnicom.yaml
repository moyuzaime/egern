name: 中国联通小组件
description: 打开中国联通 App 余量页或微信「余量查询」页查询一次即可自动读取｜更新时间：2026-11-04 19:37（北京时间）
author: iBL3ND
homepage: https://github.com/moyuzaime/egern/tree/main/ChinaUnicom
icon: https://iili.io/nEuB6Jt.png

compat_arguments:
  cuCapture: 'true'
  cuCaptureNotice: 'true'
  cuPlanNotice: 'true'
  cuMiniCapture: 'true'
  cuGeneralFlow: 'true'
  cuDirectionalFlow: 'true'
  cuUiStyle: 'classic'

compat_arguments_schema:
  cuCapture:
    name: 中国联通数据抓取
    description: 监听联通 App 请求（m.client.10010.com）；关闭后 App 侧不写入任何数据
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuMiniCapture:
    name: 微信小程序数据抓取
    description: 监听微信「中国联通」小程序的首页接口与「余量查询」页（mina / mxx），解析通用流量、其他流量、语音及账户余额/本月消费/结转/欠费。关闭后不解析小程序响应
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuUiStyle:
    name: 显示样式
    description: classic = 当前样式；dash = 仪表盘版（四宫格卡片）；ios = iOS 风格（圆环 + 列表）
    default_value: 'classic'
    options:
      - classic
      - dash
      - ios
  cuGeneralFlow:
    name: 显示通用流量
    description: 流量统计包含通用流量（关闭则只统计定向流量）
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuDirectionalFlow:
    name: 显示定向流量
    description: 流量统计包含定向流量，并单独显示一行定向余量（关闭则只统计通用流量）
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuCaptureNotice:
    name: 数据捕获成功通知
    description: 捕获到 App 登录信息或小程序套餐数据时发送通知
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuPlanNotice:
    name: 套餐查询成功通知
    description: 联通接口成功返回后通知当前话费、流量和语音余量
    default_value: 'true'
    options:
      - 'true'
      - 'false'

scriptings:
  - generic:
      name: china-unicom
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaUnicom/ChinaUnicom_Widget.js
      update_interval: 21600
      timeout: 20
      env:
        cuCapture: '{{{cuCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'
        cuPlanNotice: '{{{cuPlanNotice}}}'
        cuMiniCapture: '{{{cuMiniCapture}}}'
        cuGeneralFlow: '{{{cuGeneralFlow}}}'
        cuUiStyle: '{{{cuUiStyle}}}'
        cuDirectionalFlow: '{{{cuDirectionalFlow}}}'

  - http_request:
      name: 中国联通 App 请求侦察
      match: '^https://m\.client\.10010\.com/'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaUnicom/ChinaUnicom_Widget.js
      body_required: false
      max_size: 1048576
      timeout: 10
      env:
        cuCapture: '{{{cuCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'
        cuPlanNotice: '{{{cuPlanNotice}}}'

  - http_response:
      name: 中国联通小程序响应解析
      # mina：小程序自有接口（首页大球/手机号/账户）；mxx：小程序里的「余量查询」webview，字段最全。
      # 只匹配业务接口路径（不给整个 mxx 域缓冲响应体）；脚本再按字段识别：curntbalancecust 走账户、packageName+resources 走余量明细，非 JSON 直接跳过。
      match: '^https://(mina\.10010\.com/wxapplet/weixinNew/|mxx\.client\.10010\.com/(?:servicequerybusiness|servicebusiness)/)'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaUnicom/ChinaUnicom_Widget.js
      body_required: true
      max_size: 1048576
      timeout: 10
      env:
        cuMiniCapture: '{{{cuMiniCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'

mitm:
  hostnames:
    includes:
      - m.client.10010.com
      - mina.10010.com
      - mxx.client.10010.com

widgets:
  - name: china-unicom
    script_name: china-unicom
