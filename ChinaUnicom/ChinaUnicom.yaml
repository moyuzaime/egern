name: 中国联通小组件
description: 中国联通话费、语音、流量小组件（广电完整 UI、今日流量趋势、透明模式、锁屏组件、微信小程序接口脱敏侦察）｜更新时间：2026-10-25 20:42（北京时间）
author: iBL3ND
icon: https://iili.io/nEuB6Jt.png

compat_arguments:
  cuCapture: 'true'
  cuCaptureNotice: 'true'
  cuPlanNotice: 'true'

compat_arguments_schema:
  cuCapture:
    name: 中国联通数据抓取
    description: 监听联通 App 与微信小程序请求；小程序接口先记录脱敏结构日志
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuCaptureNotice:
    name: 中国联通数据捕获成功通知
    description: 捕获到联通 App 登录信息时发送通知
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuPlanNotice:
    name: 套餐查询成功通知
    description: 联通接口成功返回后通知当前话费、流量和语音余量
    default_value: 'true'
    options:
      - 'true'
      - 'false'

dns: {}

scriptings:
  - generic:
      name: china-unicom
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaUnicom/ChinaUnicom_Widget.js
      update_interval: 60
      timeout: 20
      env:
        cuCapture: '{{{cuCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'
        cuPlanNotice: '{{{cuPlanNotice}}}'

  - http_request:
      name: 中国联通 App 与微信小程序请求侦察
      match: '^https://(?:m\\.client\\.10010\\.com|mxx\\.client\\.10010\\.com)/'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaUnicom/ChinaUnicom_Widget.js
      body_required: false
      max_size: 1048576
      timeout: 10
      env:
        cuCapture: '{{{cuCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'
        cuPlanNotice: '{{{cuPlanNotice}}}'

mitm:
  hostnames:
    includes:
      - m.client.10010.com
      - mxx.client.10010.com

widgets:
  - name: china-unicom
    script_name: china-unicom
