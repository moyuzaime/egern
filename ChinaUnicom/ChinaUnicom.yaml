name: 中国联通小组件
description: 中国联通话费、语音、流量小组件（广电完整 UI、今日流量趋势、透明模式、锁屏组件；微信小程序抓取见 ChinaUnicom.Mini.yaml）｜更新时间：2026-11-02 02:26（北京时间）｜优化版：请求合并、鉴权失效提示、历史采样 96 点、脚本更新间隔 21600 秒
author: iBL3ND
homepage: https://github.com/moyuzaime/egern/tree/main/ChinaUnicom
icon: https://iili.io/nEuB6Jt.png

compat_arguments:
  cuCapture: 'true'
  cuCaptureNotice: 'true'
  cuPlanNotice: 'true'

compat_arguments_schema:
  cuCapture:
    name: 中国联通数据抓取
    description: 仅监听联通 App 请求；暂时关闭微信小程序域名 MITM，避免影响小程序正常访问
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuCaptureNotice:
    name: 中国联通数据捕获成功通知
    description: 捕获到联通 App 登录信息时发送通知
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cuPlanNotice:
    name: 套餐查询成功通知
    description: 联通接口成功返回后通知当前话费、流量和语音余量
    default_value: 'true'
    options:
      - 'true'
      - 'false'

scriptings:
  - generic:
      name: china-unicom
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaUnicom/ChinaUnicom_Widget.js
      update_interval: 21600
      timeout: 20
      env:
        cuCapture: '{{{cuCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'
        cuPlanNotice: '{{{cuPlanNotice}}}'

  - http_request:
      name: 中国联通 App 请求侦察
      match: '^https://m\.client\.10010\.com/'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaUnicom/ChinaUnicom_Widget.js
      body_required: false
      max_size: 1048576
      timeout: 10
      env:
        cuCapture: '{{{cuCapture}}}'
        cuCaptureNotice: '{{{cuCaptureNotice}}}'
        cuPlanNotice: '{{{cuPlanNotice}}}'

mitm:
  hostnames:
    includes:
      - m.client.10010.com

widgets:
  - name: china-unicom
    script_name: china-unicom
