name: 中国广电仪表盘测试版
description: 中国广电话费、语音、流量仪表盘测试版（新增用量洞察；独立存储，不影响正式版）｜更新时间：2026-10-11 00:18（北京时间）
author: wuhuhuuuu
icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/ChinaBroadcastNetwork.png

compat_arguments:
  cbCapture: 'true'

compat_arguments_schema:
  cbCapture:
    name: 中国广电数据抓取（测试版）
    description: 打开中国广电 App、微信或支付宝小程序查询一次即可自动捕获
    default_value: 'true'
    options:
      - 'true'
      - 'false'

dns: {}

scriptings:
  - generic:
      name: china-broadnet-test
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Test_Widget.js
      update_interval: 60
      timeout: 20

  - http_request:
      name: 中国广电测试版 App / 微信 / 支付宝小程序自动捕获
      match: '^https://(?:app|wx|zfb)\\.10099\\.com\\.cn/contact-web/api/busi/qryUserInfo'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Test_Widget.js
      body_required: true
      max_size: 1048576
      timeout: 10

mitm:
  hostnames:
    includes:
      - app.10099.com.cn
      - wx.10099.com.cn
      - zfb.10099.com.cn

widgets:
  - name: china-broadnet-test
    script_name: china-broadnet-test
