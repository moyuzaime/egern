name: 中国广电仪表盘测试版
description: "仪表盘测试版（独立存储，不影响正式版）｜打开 App 或小程序查询一次｜更新时间：2026-11-04 19:32（北京时间）"
icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/ChinaBroadcastNetwork.png

compat_arguments:
  cbCapture: 'true'
  cbCaptureNotice: 'true'
  cbPlanNotice: 'true'
  cbKeepaliveInterval: '15'
  cbDebug: 'false'
  cbTransparent: 'true'
  cbUiStyle: 'classic'

compat_arguments_schema:
  cbCapture:
    name: 中国广电数据抓取
    description: 打开中国广电 App、微信或支付宝小程序查询一次即可自动捕获
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cbCaptureNotice:
    name: 中国广电数据抓取成功通知
    description: 捕获到 App、微信或支付宝小程序套餐请求时发送通知
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cbPlanNotice:
    name: 套餐查询成功通知
    description: 接口成功返回套餐数据后发送话费、流量和语音明细通知
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cbDebug:
    name: 调试日志
    description: 打开后会在脚本日志里打印接口响应结构与业务字段，用于排查字段变化；平时保持关闭
    default_value: 'false'
    options:
      - 'true'
      - 'false'
  cbTransparent:
    name: 透明模式
    description: 默认透明（与正式版一致）。iOS 主屏「透明 / 染色」模式下必须保持开启，否则系统会把不透明浅色底渲染成一整片白；关闭则使用不透明的浅色仪表盘
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cbUiStyle:
    name: 显示样式
    description: classic = 测试版原样式；dash = 仪表盘版（四宫格卡片）；ios = iOS 风格（圆环 + 列表）
    default_value: 'classic'
    options:
      - classic
      - dash
      - ios
  cbKeepaliveInterval:
    name: 定时保活间隔
    description: 只输入数字，单位固定为分钟；例如 15 表示每 15 分钟保活一次。最小 15，最大 1440（24 小时）
    default_value: '15'

scriptings:
  - generic:
      name: china-broadnet-test
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/JS/ChinaBroadnet_Test_Widget.js
      update_interval: 21600
      timeout: 20
      env:
        cbCapture: '{{{cbCapture}}}'
        cbCaptureNotice: '{{{cbCaptureNotice}}}'
        cbPlanNotice: '{{{cbPlanNotice}}}'
        cbTransparent: '{{{cbTransparent}}}'
        cbUiStyle: '{{{cbUiStyle}}}'
        cbDebug: '{{{cbDebug}}}'

  - generic:
      name: china-broadnet-test-keepalive
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/JS/ChinaBroadnet_Test_Widget.js
      update_interval: 21600
      timeout: 20
      env:
        CB_KEEPALIVE: 'true'
        CB_KEEPALIVE_FORCE: 'true'
        cbKeepaliveInterval: '{{{cbKeepaliveInterval}}}'
        cbDebug: '{{{cbDebug}}}'

  - schedule:
      name: china-broadnet-test-keepalive-schedule
      cron: '* * * * *'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/JS/ChinaBroadnet_Test_Widget.js
      update_interval: 21600
      timeout: 15
      env:
        CB_KEEPALIVE: 'true'
        cbKeepaliveInterval: '{{{cbKeepaliveInterval}}}'
        cbDebug: '{{{cbDebug}}}'

  - http_request:
      name: 中国广电测试版 App / 微信 / 支付宝小程序自动捕获
      match: '^https://(?:app|wx|zfb)\.10099\.com\.cn/contact-web/api/busi/qryUserInfo'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/JS/ChinaBroadnet_Test_Widget.js
      body_required: true
      max_size: 1048576
      timeout: 10
      env:
        cbCapture: '{{{cbCapture}}}'
        cbCaptureNotice: '{{{cbCaptureNotice}}}'
        cbPlanNotice: '{{{cbPlanNotice}}}'
        cbDebug: '{{{cbDebug}}}'

mitm:
  hostnames:
    includes:
      - app.10099.com.cn
      - wx.10099.com.cn
      - zfb.10099.com.cn

widgets:
  - name: china-broadnet-test
    script_name: china-broadnet-test
