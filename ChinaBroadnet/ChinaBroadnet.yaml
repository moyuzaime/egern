name: 中国广电小组件
description: 中国广电 话费 语音 流量小组件（App、微信、支付宝自动捕获）｜更新时间：2026-10-23 02:32（北京时间）
author: wuhuhuuuu
icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/ChinaBroadcastNetwork.png

compat_arguments:
  cbCapture: 'true'
  cbCaptureNotice: 'true'
  cbPlanNotice: 'true'
  cbKeepaliveCron: '*/15 * * * *'

compat_arguments_schema:
  cbCapture:
    name: 中国广电数据抓取
    description: 打开中国广电 App、微信或支付宝小程序查询一次即可自动捕获
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cbCaptureNotice:
    name: 中国广电数据抓取成功通知
    description: 捕获到 App、微信或支付宝小程序套餐请求时发送通知
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cbPlanNotice:
    name: 套餐查询成功通知
    description: 接口成功返回套餐数据后发送话费、流量和语音明细通知
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  cbKeepaliveCron:
    name: 定时保活间隔 (Cron)
    description: 定时触达广电服务端以防凭据过期失效，默认每 15 分钟
    default_value: '*/15 * * * *'
    options:
      - '*/5 * * * *'
      - '*/10 * * * *'
      - '*/15 * * * *'
      - '*/30 * * * *'
      - '0 * * * *'

dns: {}

scriptings:
  - generic:
      name: china-broadnet
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Widget.js
      update_interval: 60
      timeout: 20
      env:
        cbCapture: '{{{cbCapture}}}'
        cbCaptureNotice: '{{{cbCaptureNotice}}}'
        cbPlanNotice: '{{{cbPlanNotice}}}'

  - schedule:
      name: china-broadnet-keepalive
      cron: '{{{cbKeepaliveCron}}}'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Widget.js
      update_interval: 60
      timeout: 15
      env:
        CB_KEEPALIVE: 'true'

  - http_request:
      name: 中国广电 App / 微信 / 支付宝小程序自动捕获
      match: '^https://(?:app|wx|zfb)\.10099\.com\.cn/contact-web/api/busi/qryUserInfo'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Widget.js
      body_required: true
      max_size: 1048576
      timeout: 10
      env:
        cbCapture: '{{{cbCapture}}}'
        cbCaptureNotice: '{{{cbCaptureNotice}}}'
        cbPlanNotice: '{{{cbPlanNotice}}}'

mitm:
  hostnames:
    includes:
      - app.10099.com.cn
      - wx.10099.com.cn
      - zfb.10099.com.cn

widgets:
  - name: china-broadnet
    script_name: china-broadnet
