name: 中国广电小组件
description: 中国广电 话费 语音 流量小组件
author: wuhuhuuuu
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/16/18/99/161899ef-a284-ea5d-cb5b-b8d7b8aa0ff5/AppIcon-0-0-0-85-220.png/1200x630wa.png

compat_arguments:
  cbCapture: 'true'

compat_arguments_schema:
  cbCapture:
    name: 中国广电数据抓取
    description: 打开中国广电 App 或支付宝小程序查询一次即可自动捕获
    default_value: 'true'
    options:
      - 'true'
      - 'false'

dns: {}

scriptings:
  - generic:
      name: china-broadnet
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Widget.js
      update_interval: 60
      timeout: 20

  - http_request:
      name: 中国广电 App / 支付宝小程序自动捕获
      match: '^https://(?:app|zfb)\.10099\.com\.cn/contact-web/api/busi/qryUserInfo'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Widget.js
      body_required: true
      max_size: 1048576
      timeout: 10

mitm:
  hostnames:
    includes:
      - app.10099.com.cn
      - zfb.10099.com.cn

widgets:
  - name: china-broadnet
    script_name: china-broadnet
