name: 中国广电小组件
description: 中国广电 话费 语音 流量小组件
author: wuhuhuuuu
icon: https://raw.githubusercontent.com/wuhuhuuuu/study/main/Scripts/ChinaBroadnet/ChinaBroadnet.png

compat_arguments:
  cbCapture: 'true'

compat_arguments_schema:
  cbCapture:
    name: 中国广电数据抓取
    description: 直接打开 App 就可以（抓到数据后可以关闭）
    default_value: 'true'
    options:
      - 'true'
      - 'false'

dns: {}

scriptings:
  - generic:
      name: china-broadnet
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Widget.js
      update_interval: 3600
      timeout: 20
      env:
        CB_DEBUG: 'false'

  - schedule:
      name: 中国广电数据保活
      cron: '*/20 * * * *'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Widget.js
      update_interval: 3600
      timeout: 30
      env:
        CB_KEEPALIVE: 'true'
        CB_DEBUG: 'false'

  - http_request:
      name: 中国广电 App 自动捕获
      match: '^https://app\.10099\.com\.cn/contac[{{{cbCapture}}}]t-web/api/busi/qryUserInfo'
      script_url: https://raw.githubusercontent.com/moyuzaime/egern/main/ChinaBroadnet/ChinaBroadnet_Widget.js
      body_required: true
      max_size: 1048576
      timeout: 10

mitm:
  hostnames:
    includes:
      - app.10099.com.cn

widgets:
  - name: china-broadnet